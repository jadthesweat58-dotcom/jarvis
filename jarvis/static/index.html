<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS Command Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%233aa6ff' stroke-width='8'/><circle cx='50' cy='50' r='14' fill='%233aa6ff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><span></span></span>
      <div>
        <div class="brand-name">JARVIS</div>
        <div class="brand-sub">COMMAND CENTER</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Sections">
      <button class="active" data-view="dashboard"><i data-icon="grid"></i><span>Command Center</span></button>
      <button data-view="chat"><i data-icon="message"></i><span>Conversations</span><b id="navTurns"></b></button>
      <button data-view="todos"><i data-icon="file"></i><span>Tasks</span><b id="navTodos"></b></button>
      <button data-view="reminders"><i data-icon="calendar"></i><span>Reminders</span><b id="navReminders"></b></button>
      <button data-view="facts"><i data-icon="database"></i><span>Memory</span><b id="navFacts"></b></button>
      <button data-view="notes"><i data-icon="book"></i><span>Notes</span><b id="navNotes"></b></button>
      <button data-view="contacts"><i data-icon="users"></i><span>Contacts</span><b id="navContacts"></b></button>
      <button data-view="calls"><i data-icon="phone"></i><span>Phone Calls</span><b id="navCalls"></b></button>
      <button data-view="tools"><i data-icon="tool"></i><span>Tools &amp; Skills</span><b id="navTools"></b></button>
    </nav>

    <section class="voice-link">
      <div class="vl-head"><span>VOICE LINK</span><em id="voiceState">Standby</em></div>
      <button class="operator" id="operatorBtn" title="Talk to Jarvis">
        <span class="avatar"><i data-icon="user"></i></span>
        <span><strong id="opName">Operator</strong><small id="opSub">Clearance · Owner</small></span>
      </button>
    </section>
  </aside>

  <!-- ============ CENTER ============ -->
  <main class="center">
    <header class="topbar">
      <div class="clock">
        <div id="date">—</div>
        <div id="time">--:--:--</div>
      </div>
      <div class="pill" id="sysPill"><i class="dot"></i><span id="sysStatus">Connecting…</span></div>
      <form class="search" id="askForm" role="search">
        <i data-icon="search"></i>
        <input id="ask" autocomplete="off" placeholder="Ask or search…" aria-label="Ask Jarvis">
      </form>
      <button class="icon-btn" id="bellBtn" title="Notifications" aria-label="Notifications"><i data-icon="bell"></i><b id="bellCount"></b></button>
      <button class="icon-btn" id="gearBtn" title="Settings" aria-label="Settings"><i data-icon="settings"></i></button>
      <div class="menu" id="menu" hidden>
        <label><input type="checkbox" id="speakToggle" checked> Speak replies out loud</label>
        <label><input type="checkbox" id="wakeToggle"> "Hey Jarvis" wake word</label>
        <button id="newChat" type="button">Start a new conversation</button>
        <button id="lockBtn" type="button">Lock (forget access token)</button>
      </div>
    </header>

    <section class="core" aria-label="AI core">
      <dl class="stats left">
        <div><dt>MODEL</dt><dd id="stModel">—</dd></div>
        <div><dt>LATENCY</dt><dd id="stLatency">—</dd></div>
        <div><dt>MEMORY</dt><dd id="stMemory">—</dd></div>
      </dl>
      <dl class="stats right">
        <div><dt>SKILLS</dt><dd id="stSkills">—</dd></div>
        <div><dt>LINK</dt><dd id="stLink">—</dd></div>
        <div><dt>UPTIME</dt><dd id="stUptime">—</dd></div>
      </dl>
      <canvas id="ring" aria-hidden="true"></canvas>
      <button class="core-label" id="coreBtn" title="Tap to talk">
        <span class="core-name">JARVIS</span>
        <span class="core-state" id="coreState">STANDING BY</span>
      </button>
    </section>

    <section class="chatbox" aria-label="Chat with Jarvis">
      <div class="chat-head"><span>CONVERSATION</span><span class="rule"></span><button class="link" data-open="chat">Full history</button></div>
      <div class="box-log" id="boxLog" aria-live="polite"></div>
      <div class="said-actions" id="capActions"></div>
      <div class="box-live" id="capUser"></div>
      <form class="box-input" id="boxForm">
        <input id="boxInput" autocomplete="off" placeholder="Message Jarvis…" aria-label="Message Jarvis">
        <button type="submit" class="send">Send</button>
        <button type="button" class="talk" id="talkBtn"><i data-icon="mic" id="talkIcon"></i><span id="talkLabel">Talk</span></button>
      </form>
    </section>

    <section class="timeline" aria-label="Mission timeline">
      <div class="tl-head"><span>MISSION TIMELINE</span><span class="rule"></span><button class="link" data-open="reminders">Today</button></div>
      <ol class="tl-track" id="timeline"></ol>
    </section>
  </main>

  <!-- ============ RIGHT ============ -->
  <aside class="right">
    <section class="panel tasks">
      <div class="panel-head"><span>ALL TASKS</span><em id="taskCount">—</em></div>
      <ul class="task-list" id="tasks"></ul>
      <form class="task-add" id="taskForm">
        <input id="taskInput" autocomplete="off" placeholder="Add a task…" aria-label="New task">
        <select id="taskPriority" aria-label="Priority">
          <option value="high">High</option>
          <option value="med" selected>Med</option>
          <option value="low">Low</option>
        </select>
      </form>
    </section>

    <section class="panel monitor">
      <div class="panel-head"><span>SYSTEM MONITOR</span><em id="monitorWhere">Live</em></div>
      <div class="meters" id="meters"></div>
    </section>
  </aside>
</div>

<!-- ============ DRAWER (conversation, lists, notifications) ============ -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span id="drawerTitle">CONVERSATIONS</span>
    <button class="icon-btn" id="drawerClose" aria-label="Close"><i data-icon="x"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="chat-log" id="chatLog"></div>
    <ul class="item-list" id="itemList" hidden></ul>
  </div>
  <form class="drawer-input" id="drawerForm">
    <input id="drawerInput" autocomplete="off" placeholder="Message Jarvis…" aria-label="Message Jarvis">
    <button type="button" class="icon-btn" id="drawerMic" aria-label="Speak"><i data-icon="mic"></i></button>
    <button type="submit" class="send">Send</button>
  </form>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="login">
  <form method="dialog" id="loginForm">
    <div class="panel-head"><span>ACCESS REQUIRED</span></div>
    <p>Enter the <code>JARVIS_ACCESS_TOKEN</code> from your server's settings.</p>
    <input id="token" type="password" autocomplete="current-password" required>
    <button type="submit" class="send">Unlock</button>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
